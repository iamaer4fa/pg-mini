name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Ubuntu package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pg-mini-linux-amd64
          path: target/debian/*.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows executable and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml).Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must be v$version"
          }

      - name: Build Windows executable
        run: cargo build --release --locked

      - name: Prepare installer assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\installer | Out-Null
          Copy-Item target\release\pg-mini.exe target\installer\pg-mini.exe
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml).Matches.Groups[1].Value
          Copy-Item target\release\pg-mini.exe "target\installer\pg-mini-$version-x64.exe"
          Invoke-WebRequest `
            -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe `
            -OutFile target\vc_redist.x64.exe
          if ((Get-Item target\vc_redist.x64.exe).Length -lt 1000000) {
            throw "Microsoft Visual C++ Redistributable download appears incomplete"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" packaging\windows\pg-mini.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: pg-mini-windows-x64
          path: |
            target/installer/pg-mini-*-x64.exe
            target/installer/pg-mini-setup-*-x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            os: macos-15
          - target: x86_64-apple-darwin
            arch: x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build macOS app
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package macOS disk image
        run: ./packaging/macos/build-dmg.sh "${{ matrix.target }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pg-mini-macos-${{ matrix.arch }}
          path: target/macos/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
